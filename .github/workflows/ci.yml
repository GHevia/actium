name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.14"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install Actium and test dependencies
        run: python -m pip install -e ".[dev,jdk]"
      - name: Install Orekit data for Sun/Moon tests
        run: >-
          python -m pip install
          "git+https://gitlab.orekit.org/orekit/orekit-data.git@baf158744d38ec76cf94e2d396280d545b9f0ba2"
      - name: Test
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
